name: Verify approved investment images source
on:
  push:
    branches: [feat/investment-catalog-a-m-20261112]
    paths: ['.github/workflows/investment-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check linked Drive image A is accessible and byte-identical
        run: |
          python -m pip install --quiet gdown
          python - <<'PY'
          import gdown, hashlib, os
          path='/tmp/CH1-VA-A-001.png'
          url='https://drive.google.com/uc?id=15D-LxpZJ6TM6Okyj9d7hGycq9B5chkGo'
          downloaded=gdown.download(url, path, quiet=True)
          if not downloaded: raise RuntimeError('Drive download unavailable')
          digest=hashlib.sha256(open(path,'rb').read()).hexdigest()
          assert digest=='b0d8518596bb040ff00f0eac562d6b184ba3c078d78d688b5e3eeb0e04f00fc4',f'Asset A hash mismatch: {digest}'
          print('PASS: approved current A image', os.path.getsize(path), 'bytes')
          PY
