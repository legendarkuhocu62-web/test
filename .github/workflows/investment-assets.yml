name: Import approved A–M investment images (test branch only)
on:
  push:
    branches: [feat/investment-catalog-a-m-20261112]
    paths:
      - '.github/workflows/investment-assets.yml'
      - 'scripts/import-investment-assets.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    if: github.ref == 'refs/heads/feat/investment-catalog-a-m-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved originals; verify SHA-256; crop only photographic areas
        run: |
          python -m pip install --quiet gdown pillow
          python scripts/import-investment-assets.py
      - name: Commit files to the test feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/investments/
          if git diff --cached --quiet; then
            echo 'Approved assets already present, no changes.'
          else
            git commit -m 'assets(investments): add verified 13 original cards and cropped photo thumbnails'
            git push origin HEAD:feat/investment-catalog-a-m-20261112
          fi
