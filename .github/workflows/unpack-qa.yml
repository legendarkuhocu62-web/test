name: Unpack reconstructed test build
on:
  push:
    branches: [main]
    paths:
      - '_upload/**'
      - '.github/workflows/unpack-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          test -f _upload/part-000.b64
          cat _upload/part-*.b64 | base64 --decode > /tmp/ceh404-rebuilt.zip
          unzip -t /tmp/ceh404-rebuilt.zip | tail -1
          unzip -o /tmp/ceh404-rebuilt.zip -d .
          test -s index.html
          test -s app.js
          test -s assets/manifest.json
          rm -rf _upload
      - name: Commit game files to test repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy reconstructed QA build [skip ci]"
            git push origin HEAD:main
          fi
