name: Optimize CH1 final-screen graphics
on:
  push:
    branches: [feat/ch1-final-art-assets-20261123]
    paths:
      - 'assets/final-source/**'
      - 'scripts/optimize-final-assets.py'
      - '.github/workflows/optimize-ch1-final.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Convert originals to optimized WebP
        run: python scripts/optimize-final-assets.py
      - name: Commit optimized assets back into this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/final/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "build(assets): optimize final-screen graphics for web"
            git push origin "HEAD:feat/ch1-final-art-assets-20261123"
          fi
