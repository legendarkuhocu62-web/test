name: Check final screen optimized art
on:
  push:
    branches: [feat/ch1-final-ui-live-20261123]
  pull_request:
    paths:
      - 'assets/final/**'
      - 's06-s08-ui.css'
      - 'index.html'
      - 'tests/s08-final-art-browser.test.js'
      - 'scripts/check-final-assets.py'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-final-assets.py
      - run: node --check s06-s08-ui.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Check desktop and mobile final art
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ceh404-final-http.log 2>&1 &
          sleep 2
          node tests/s08-final-art-browser.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-art-mobile-desktop
          path: tests/screenshot-final-art-*.png
          if-no-files-found: ignore
