name: Optimize Chapter 01 final screen assets
on:
  push:
    branches:
      - feat/final-art-optimized-20261123
    paths:
      - '_asset_upload/final/**'
      - '.github/workflows/optimize-final-assets.yml'
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image encoder
        run: python -m pip install 'pillow>=10,<13'
      - name: Convert and verify all seven assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          src=Path('_asset_upload/final')
          dest=Path('assets/final')
          dest.mkdir(parents=True,exist_ok=True)
          expected={
            'CH1-FINAL-BG-D-001':(1672,941,False),
            'CH1-FINAL-BG-M-001':(941,1672,False),
            'CH1-FINAL-CARD-02-001':(1672,941,False),
            'CH1-FINAL-CARD-03-001':(1672,941,False),
            'CH1-FINAL-ICON-COMPLETE-001':(1254,1254,True),
            'CH1-FINAL-DECOR-DOMINO-001':(1254,1254,True),
            'CH1-FINAL-DECOR-LAUREL-001':(2172,724,True),
          }
          audit=[]
          for asset,(w,h,alpha) in expected.items():
            source=src/(asset+'.png')
            assert source.exists(),f'Missing original: {source}'
            with Image.open(source) as im:
              im.load()
              assert im.size==(w,h),(asset,im.size)
              assert im.getbbox() is not None,asset
              actual_alpha=('A' in im.getbands())
              assert actual_alpha==alpha,(asset,im.mode)
              outfile=dest/(asset+'.webp')
              converted=im.convert('RGBA' if alpha else 'RGB')
              converted.save(outfile,format='WEBP',quality=88,method=6,exact=alpha)
            with Image.open(outfile) as chk:
              chk.load()
              assert chk.format=='WEBP' and chk.size==(w,h),asset
              assert ('A' in chk.getbands())==alpha,asset
            original=source.stat().st_size
            compressed=outfile.stat().st_size
            assert compressed<original,(asset,original,compressed)
            audit.append((asset,original,compressed))
          assert len(list(dest.glob('*.webp')))==7,'Unexpected WebP count'
          for name,a,b in audit: print(f'{name}: {a:,} -> {b:,} bytes ({100*b/a:.1f}%)')
          print(f'Total: {sum(a for _,a,_ in audit):,} -> {sum(b for _,_,b in audit):,} bytes')
          PY
      - name: Commit only optimized assets and remove temporary PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch _asset_upload/final
          git add assets/final/
          git diff --cached --check
          git commit -m 'assets(final): add verified lightweight WebP artwork [skip ci]'
          git push origin "HEAD:feat/final-art-optimized-20261123"
