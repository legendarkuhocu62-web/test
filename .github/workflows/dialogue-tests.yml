name: Dialogue UI regression tests
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'style.css'
      - 'index.html'
      - 'assets/backgrounds/**'
      - 'data.js'
      - 'dialogue-ui.js'
      - 'scene-preload.js'
      - 'materials-panel.js'
      - 'materials-panel.css'
      - 'logic.js'
      - 'tests/**'
      - '.github/workflows/dialogue-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dialogue navigation and source integrity
        run: |
          node tests/dialogue-ui.test.js
          node tests/dialogue-punctuation.test.js
          node tests/edu01-approved-documents.test.js
          node tests/asset-performance.test.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run visual viewport checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ceh404-http.log 2>&1 &
          sleep 2
          node tests/dialogue-browser.test.js
          node tests/scene-preload.test.js
          node tests/budget-overflow-modal.test.js
          node tests/dialogue-fixed-frame.test.js
          node tests/dialogue-question-pages.test.js
          node tests/edu01-reference-flow.test.js
          node tests/gromov-character-dialogue.test.js
          node tests/save-continue-label.test.js
          node integration/s06-s08/module.test.js
          node tests/s06-s08-ui.test.js
          node tests/s05-committee-journey.test.js
          node tests/otk-industrial-hint.test.js
          node tests/entrance-asset.test.js
          node tests/s00-mobile-badge.test.js
          node tests/visual-fixes.test.js
          node tests/design-layout.test.js
          node tests/materials-panel.test.js
          node tests/s03-mobile-background.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialogue-browser-screenshots
          path: tests/screenshot-*.png
          if-no-files-found: ignore
