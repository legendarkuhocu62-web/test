name: Temporary S08 approval QA
on:
  push:
    branches: [fix/s08-personal-final-20261119]
    paths:
      - 's06-s08-ui.js'
      - 's06-s08-ui.css'
      - 'integration/s06-s08/**'
      - 'tests/s06-s08-ui.test.js'
      - '.github/workflows/s08-personal-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s08-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node integration/s06-s08/module.test.js
      - run: |
          node --check app.js
          node --check s06-s08-ui.js
          node --check integration/s06-s08/s06_s08_module.js
          node --check tests/s06-s08-ui.test.js
  s08-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: S06 and S07 integration + S08 phone and desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ceh404-s08-http.log 2>&1 &
          sleep 2
          node tests/s06-s08-ui.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-approved-mobile-desktop
          path: tests/screenshot-s08-*.png
          if-no-files-found: ignore
